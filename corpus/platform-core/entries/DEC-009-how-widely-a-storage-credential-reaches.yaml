id: DEC-009
kind: decision
title: How widely a storage credential reaches
provenance: shipped

vendor:
  strength: option
  quote: >-
    "An external location combines a cloud storage path with a storage credential that authorizes
    access to the specified path. Multiple external locations can reference the same storage credential."
    Sharing is permitted, and the page says nothing about how many credentials to create.
  source: https://docs.databricks.com/aws/en/connect/unity-catalog/cloud-storage/storage-credentials#overview-of-external-locations
  checked: 2026-10-30

# One credential per cloud object storage is what the vendor's setup shows, not
# what it recommends. The manual setup's IAM policy names one S3 bucket
# (https://docs.databricks.com/aws/en/connect/unity-catalog/cloud-storage/s3/s3-external-location-manual,
# checked 2026-10-14), and the best-practices page says only that external
# locations, "by combining storage credentials and storage paths, provide
# strong control and auditability of storage access"
# (https://docs.databricks.com/aws/en/data-governance/unity-catalog/best-practices#external-locations,
# checked 2026-10-14). So no option here is the vendor's default.
#
# **The unit is the cloud identity, not the credential object.** A storage
# credential wraps an identity: an IAM role on AWS, an access connector's
# managed identity on Azure, a service account on GCP. Two credentials over one
# identity reach exactly what one would, so the rules compare identities.
#
# **A catalog's reach is read from its effective root.** A catalog with a root
# of its own reaches it through the external location whose URL is the longest
# prefix of that root, and so through that location's credential. A catalog
# inheriting the metastore's root reaches it through the metastore's own
# credential, which every inheriting catalog shares: two of them share an
# identity whether or not the estate declares which one it is.
#
# **Independent of DEC-008.** Catalogs in one cloud object storage may still
# use different credentials, each on its own path, and catalogs in different
# cloud object storage may share one. A team that shares storage and records a
# credential per catalog separates the catalogs in Unity Catalog, but an
# identity scoped to the whole storage can still reach all of it in the cloud.
question: Which catalogs may reach their managed storage through the same cloud identity?

options:
  - key: per-catalog
    label: PER CATALOG — every catalog's storage is reached by an identity of its own
    cost: >-
      a cloud identity, storage credential and external location to provision per catalog
    rule:
      summary: |
        no cloud identity reaches the storage of two catalogs, whether through their own roots or
        a root inherited from the metastore
      failure_message: >-
        {resource} reaches its managed storage as {identity}, which also reaches the storage of
        {catalogs}. {adr} records an identity per catalog.
      evaluator: catalog_identities_unshared
      enforceability: strong
      scope: estate
      clouds: [aws, azure, gcp]
      unevaluable_when: >-
        a catalog's root is covered by no external location the estate declares, a catalog
        inheriting the metastore's root must be compared with one that does not and the estate
        does not declare the metastore's credential, or the identity is computed from a value
        unknown until apply

  # As in DEC-008: under `environment` a catalog *is* an environment, so this
  # would enforce what per-catalog does, and under `domain` a catalog spans
  # every environment. Only `both` leaves a layout of its own. The environment
  # is read from the catalog's name, as DEC-002 records it.
  - key: by-environment
    label: BY ENVIRONMENT — an identity reaches only catalogs of one environment
    cost: >-
      domains inside one environment are separated by grants alone, and a misgranted or leaked
      credential reaches every domain in that environment
    available_when:
      DEC-002: [both]
    rule:
      summary: |
        the catalogs whose storage one cloud identity reaches all belong to one environment
      failure_message: >-
        {identity} reaches the managed storage of catalogs in more than one environment:
        {catalogs}. {adr} records sharing within an environment only.
      evaluator: shared_identities_one_environment
      uses: [environments]
      enforceability: strong
      scope: estate
      clouds: [aws, azure, gcp]
      unevaluable_when: >-
        a catalog's name carries no recorded environment, its root is covered by no external
        location the estate declares, a catalog inheriting the metastore's root must be compared
        with one that does not and the estate does not declare the metastore's credential, or the
        identity is computed from a value unknown until apply

  # Not enforced, and recorded as such. An identity per catalog conforms to this
  # answer as well as any sharing does.
  - key: unconstrained
    label: UNCONSTRAINED — any catalogs may share an identity; nothing is enforced
    cost: >-
      nothing stops one credential reaching production and development storage alike
    unconstrained: >-
      the team leaves how widely a storage credential reaches open; an identity per catalog and
      any sharing conform alike
